name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TECHNICIAN_SERVICE_PRO_ANDROID_PROJECT.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Extract project
        run: |
          unzip -q TECHNICIAN_SERVICE_PRO_ANDROID_PROJECT.zip -d workspace

      - name: Install and build
        working-directory: workspace/TECHNICIAN_SERVICE_PRO_ANDROID
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: workspace/TECHNICIAN_SERVICE_PRO_ANDROID/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TECHNICIAN-SERVICE-PRO-APK
          path: workspace/TECHNICIAN_SERVICE_PRO_ANDROID/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
