
name: Build Technician Service Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TECHNICIAN_SERVICE_PRO_ANDROID_PROJECT.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract project
        run: |
          mkdir workspace
          unzip -q TECHNICIAN_SERVICE_PRO_ANDROID_PROJECT.zip -d workspace
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/workspace/TECHNICIAN_SERVICE_PRO_ANDROID" >> $GITHUB_ENV

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        working-directory: workspace/TECHNICIAN_SERVICE_PRO_ANDROID
        run: npm install

      - name: Build web application
        working-directory: workspace/TECHNICIAN_SERVICE_PRO_ANDROID
        run: npm run build

      - name: Add and sync Android
        working-directory: workspace/TECHNICIAN_SERVICE_PRO_ANDROID
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: workspace/TECHNICIAN_SERVICE_PRO_ANDROID/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TECHNICIAN-SERVICE-PRO-APK
          path: workspace/TECHNICIAN_SERVICE_PRO_ANDROID/android/app/build/outputs/apk/debug/app-debug.apk
